jobs:
  macos-pcc0-regressions:
    name: macOS arm64 focused pcc0 native regressions
    runs-on: macos-15
    timeout-minutes: 25
    # Separate from Stage1: these exact programs use a threaded/atomic runtime.
    # The existing Stage1 configuration and its 45-minute budget stay unchanged.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Execute focused Darwin regressions with one matched runtime
        run: |
          env -u LC_ALL uv run python scripts/run_process_tree_sample.py \
            --result build/macos-regressions/work/supervisor/result.json \
            --samples build/macos-regressions/work/supervisor/samples.tsv \
            --stdout build/macos-regressions/work/supervisor/target.stdout \
            --stderr build/macos-regressions/work/supervisor/target.stderr \
            --timeout 1200 --interval 0.25 --progress-interval 30 \
            --auto-tree-rss-ceiling-bytes 4294967296 \
            --min-tree-rss-bytes 2147483648 \
            --darwin-preflight-reserve-bytes 536870912 \
            -- uv run python scripts/ci_macos_regression_gate.py \
            --out-dir build/macos-regressions

      - name: Collect complete bounded Mac regression receipts
        if: always()
        run: |
          env -u LC_ALL uv run python scripts/ci_macos_regression_gate.py \
            --out-dir build/macos-regressions --collect-evidence

      - name: Preserve Mac regression receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pcc0-regression-receipts
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
          # Complete compressed logs/receipts only; no archives, objects or IR.
          path: build/macos-regressions/evidence/

  macos-pcc0-float-doc-regressions:
    name: macOS arm64 pcc0 float and class-doc regressions
    runs-on: macos-15
    timeout-minutes: 25
    # Independent of the existing regression and Stage1 jobs.
    # Build a source-matched threaded/atomic runtime within this job's own cap.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Execute float and class-doc regressions with one matched runtime
        run: |
          uv run python scripts/run_process_tree_sample.py \
            --result build/macos-float-doc/work/supervisor/result.json \
            --samples build/macos-float-doc/work/supervisor/samples.tsv \
            --stdout build/macos-float-doc/work/supervisor/target.stdout \
            --stderr build/macos-float-doc/work/supervisor/target.stderr \
            --timeout 1200 --interval 0.25 --progress-interval 30 \
            --auto-tree-rss-ceiling-bytes 4294967296 \
            --min-tree-rss-bytes 2147483648 \
            --darwin-preflight-reserve-bytes 536870912 \
            -- uv run python scripts/ci_macos_regression_gate.py \
            --out-dir build/macos-float-doc --profile float-doc

      - name: Collect complete bounded float and class-doc receipts
        if: always()
        run: |
          uv run python scripts/ci_macos_regression_gate.py \
            --out-dir build/macos-float-doc --profile float-doc --collect-evidence

      - name: Preserve float and class-doc receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pcc0-float-doc-receipts
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
          # Complete compressed logs/receipts only; no archives, objects or IR.
          path: build/macos-float-doc/evidence/

  macos-pcc0-indexed-split:
    name: macOS arm64 pcc0 indexed-stage bridge gate
    runs-on: macos-15
    timeout-minutes: 25
    # Real host child/object and compiler-owned helper lowering evidence.
    # No runtime build or native helper execution is claimed by this gate.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Verify handoff contracts with the normal six-worker pytest default
        run: |
          uv run python scripts/run_process_tree_sample.py \
            --result build/macos-indexed-split/work/handoff-xdist-supervisor/result.json \
            --samples build/macos-indexed-split/work/handoff-xdist-supervisor/samples.tsv \
            --stdout build/macos-indexed-split/work/handoff-xdist-supervisor/target.stdout \
            --stderr build/macos-indexed-split/work/handoff-xdist-supervisor/target.stderr \
            --timeout 300 --interval 1 --progress-interval 30 \
            --auto-tree-rss-ceiling-bytes 4294967296 \
            --min-tree-rss-bytes 2147483648 \
            --darwin-preflight-reserve-bytes 536870912 \
            -- uv run python scripts/ci_macos_regression_gate.py \
            --out-dir build/macos-indexed-split --handoff-xdist

      - name: Verify real split objects and helper closed-world lowering
        run: |
          uv run python scripts/run_process_tree_sample.py \
            --result build/macos-indexed-split/work/supervisor/result.json \
            --samples build/macos-indexed-split/work/supervisor/samples.tsv \
            --stdout build/macos-indexed-split/work/supervisor/target.stdout \
            --stderr build/macos-indexed-split/work/supervisor/target.stderr \
            --timeout 1200 --interval 0.25 --progress-interval 30 \
            --auto-tree-rss-ceiling-bytes 4294967296 \
            --min-tree-rss-bytes 2147483648 \
            --darwin-preflight-reserve-bytes 536870912 \
            -- uv run python scripts/ci_macos_regression_gate.py \
            --out-dir build/macos-indexed-split --profile indexed-split

      - name: Collect complete bounded indexed-stage receipts
        if: always()
        run: |
          uv run python scripts/ci_macos_regression_gate.py \
            --out-dir build/macos-indexed-split --profile indexed-split --collect-evidence

      - name: Preserve indexed-stage receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pcc0-indexed-split-receipts
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
          path: build/macos-indexed-split/evidence/

  other-platform-native-wheel:
    name: Native wheel / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      PCC_BUILD_BACKEND: self
      PCC_RUNTIME_CC: pcc
      PCC_RUNTIME_HIGH: py
      # Qualification logs retain the existing worker phase/function timings.
      PCC_PY_FRONTEND_WORKER_TIMING: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, docker_platform: linux/amd64 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, docker_platform: linux/arm64 }
          - { platform: windows-x86_64, runner: windows-2022 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install wheel-build tools
        run: python -m pip install build hatchling

      - name: Set up uv for locked tests on the existing Python 3.13 host
        uses: astral-sh/setup-uv@v5

      - name: Install locked development dependencies
        run: uv sync --frozen --dev --python 3.13

      - name: Validate default xdist, native prior workers, and changed-module emission
        run: uv run --frozen --no-sync --python 3.13 python scripts/ci_worker_size_prior_gate.py --out-dir build/worker-prior-gate --phase preflight

      - name: Install Windows publication test tools
        if: matrix.platform == 'windows-x86_64'
        run: python -m pip install pytest

      - name: Verify Windows RSS publication with a held reader
        if: matrix.platform == 'windows-x86_64'
        timeout-minutes: 2
        # This isolated test needs no POSIX-only repository conftest fixtures.
        run: python -m pytest --noconftest -o "addopts=" -x -vv --tb=short tests/python/test_worker_resource_publication.py

      - name: Qualify all five GC self-host chains and Stage1 admission metrics
        run: uv run --frozen --no-sync --python 3.13 python scripts/ci_worker_size_prior_gate.py --out-dir build/worker-prior-gate --phase stage1

      - name: Verify the new pcc1 on native prior worker shapes
        run: uv run --frozen --no-sync --python 3.13 python scripts/ci_worker_size_prior_gate.py --out-dir build/worker-prior-gate --phase pcc1

      - name: Preserve platform qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.platform }}
          path: |
            build/platform-qualification/**/*.log
            build/platform-qualification/**/*.json
            build/platform-qualification/**/*.jsonl
            build/worker-prior-gate/**/*.json
            build/worker-prior-gate/**/*.jsonl
            build/worker-prior-gate/**/*.log
            build/worker-prior-gate/**/*.stdout
            build/worker-prior-gate/**/*.stderr
            build/worker-prior-gate/**/*.tsv
            build/worker-prior-gate/**/*.xml

      - name: Build this machine's native wheel
        id: build
        run: python -m build --wheel --no-isolation --outdir dist

      - name: Install and execute the Linux wheel inside Docker
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          docker info --format '{{.OSType}} {{.Architecture}}'
          docker run --rm --platform "${{ matrix.docker_platform }}" \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --workdir /workspace \
            --network none \
            python:3.13-bookworm \
            python scripts/ci_native_wheel_gate.py dist

      - name: Install and execute the Windows wheel inside Docker
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Running') { Start-Service docker }
          docker info --format '{{.OSType}} {{.Architecture}}'
          docker run --rm --isolation=process `
            --mount "type=bind,source=$env:GITHUB_WORKSPACE,target=C:\workspace" `
            --workdir C:\workspace `
            python:3.13-windowsservercore-ltsc2022 `
            python scripts/ci_native_wheel_gate.py dist

      - name: Install wheel and execute native output on the runner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/ci_native_wheel_gate.py dist

  pcc1-package-parity:
    needs: macos-pcc0-indexed-split
    name: macOS arm64 native pcc1 and installed wheel
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PCC_REQUIRE_CURRENT_PCC1: "1"
      PCC_BOOTSTRAP_OUT_DIR: "${{ github.workspace }}/build/bootstrap"
      PCC_CURRENT_PCC1: "${{ github.workspace }}/build/bootstrap/pcc1"
      PCC_BOOTSTRAP_RUNTIME_CC: "pcc"
      PCC_BOOTSTRAP_RUNTIME_HIGH: "py"
      PCC_BOOTSTRAP_PYTHON_LIBPYTHON: "off"
      # Select from observed reclaimable RAM, disk space and swap pressure on
      # the 7 GB runner. Keep a 4 GiB ceiling, a 2 GiB admission floor and the
      # existing 512 MiB reserve; never round a low observation up to the floor.
      PCC_BOOTSTRAP_AUTO_TREE_RSS_CEILING_BYTES: "4294967296"
      PCC_BOOTSTRAP_MIN_TREE_RSS_BYTES: "2147483648"
      PCC_BOOTSTRAP_HOST_MEMORY_RESERVE_BYTES: "536870912"
      # Three M1 cores: a local 12-core Stage1 already takes ~520 s.
      PCC_BOOTSTRAP_STAGE_TIMEOUT: "2400"
      # Keep phase/module timing in the retained process stderr on timeout.
      PCC_PY_FRONTEND_WORKER_TIMING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS arm64 self-backend runner
        run: |
          test "$(uname)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Validate default xdist, native prior workers, and changed-module emission
        run: uv run --frozen --no-sync python scripts/ci_worker_size_prior_gate.py --out-dir build/worker-prior-gate --phase preflight

      - name: Build current pcc1
        env:
          # Opt in only this Stage1 build, after the independent gate passed.
          PCC_HOST_INDEXED_PROCESS_SPLIT: "1"
        run: uv run --frozen --no-sync python scripts/ci_worker_size_prior_gate.py --out-dir build/worker-prior-gate --phase stage1

      - name: Verify the new pcc1 on native prior worker shapes
        run: uv run --frozen --no-sync python scripts/ci_worker_size_prior_gate.py --out-dir build/worker-prior-gate --phase pcc1

      - name: Preserve macOS bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-macos-arm64
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/bootstrap/stage*.process.*/result.json
            build/bootstrap/stage*.process.*/samples.tsv
            build/bootstrap/stage*.process.*/target.stdout
            build/bootstrap/stage*.process.*/target.stderr
            build/bootstrap/stage*.process.*/result.json.worker-rss.tsv
            build/bootstrap/stage*.json
            build/worker-prior-gate/**/*.json
            build/worker-prior-gate/**/*.jsonl
            build/worker-prior-gate/**/*.log
            build/worker-prior-gate/**/*.stdout
            build/worker-prior-gate/**/*.stderr
            build/worker-prior-gate/**/*.tsv
            build/worker-prior-gate/**/*.xml

      - name: Build, install, and execute the native wheel
        run: |
          env -u LC_ALL uv run pytest -x -n0 -vv --tb=short -m integration \
            tests/integration/test_uv_pcc_project_environment.py::test_uv_installed_pcc_and_pcc1_share_private_overlay

      - name: Run pcc1 package parity hard gate
        run: |
          env -u LC_ALL uv run pytest -x -q -n0 \
            tests/python/test_package_pcc1_parity_gate.py \
            tests/python/test_package_import_path.py \
            tests/python/test_package_install.py \
            tests/python/test_package_campaign.py \
            tests/python/test_package_linkage.py \
            tests/python/test_package_inspect.py \
            tests/python/test_package_extension_abi.py \
            tests/python/test_package_toolchain.py \
            tests/python/test_package_build_exec.py \
            tests/python/test_package_wheel_repo.py \
            tests/python/test_package_build_plan.py \
            tests/python/test_package_array_core.py
