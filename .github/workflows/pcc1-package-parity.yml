name: Package platform and pcc1 wheel gates

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "pcc/**"
      - "hatch_build.py"
      - "pyproject.toml"
      - "tests/python/test_package_*.py"
      - "tests/python/pcc1_gate.py"
      - "tests/python/test_pcc_native_extension_loader.py"
      - "tests/integration/test_uv_pcc_project_environment.py"
      - "scripts/ci_native_wheel_gate.py"
      - "scripts/bootstrap.py"
      - "scripts/bootstrap_platform.py"
      - "scripts/platform_process_watchdog.py"
      - ".github/workflows/pcc1-package-parity.yml"
  pull_request:
    paths:
      - "pcc/**"
      - "hatch_build.py"
      - "pyproject.toml"
      - "tests/python/test_package_*.py"
      - "tests/python/pcc1_gate.py"
      - "tests/python/test_pcc_native_extension_loader.py"
      - "tests/integration/test_uv_pcc_project_environment.py"
      - "scripts/ci_native_wheel_gate.py"
      - "scripts/bootstrap.py"
      - "scripts/bootstrap_platform.py"
      - "scripts/platform_process_watchdog.py"
      - ".github/workflows/pcc1-package-parity.yml"

jobs:
  other-platform-native-wheel:
    name: Native wheel / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      PCC_BUILD_BACKEND: self
      PCC_RUNTIME_CC: pcc
      PCC_RUNTIME_HIGH: py
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, docker_platform: linux/amd64 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, docker_platform: linux/arm64 }
          - { platform: windows-x86_64, runner: windows-2022 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install wheel-build tools
        run: python -m pip install build hatchling

      - name: Qualify all five GC self-host chains
        run: python scripts/bootstrap_platform.py --gc all --out-dir build/platform-qualification

      - name: Preserve platform qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.platform }}
          path: |
            build/platform-qualification/**/*.log
            build/platform-qualification/**/*.json
            build/platform-qualification/**/*.jsonl

      - name: Build this machine's native wheel
        id: build
        run: python -m build --wheel --no-isolation --outdir dist

      - name: Install and execute the Linux wheel inside Docker
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          docker info --format '{{.OSType}} {{.Architecture}}'
          docker run --rm --platform "${{ matrix.docker_platform }}" \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --workdir /workspace \
            --network none \
            python:3.13-bookworm \
            python scripts/ci_native_wheel_gate.py dist

      - name: Install and execute the Windows wheel inside Docker
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Running') { Start-Service docker }
          docker info --format '{{.OSType}} {{.Architecture}}'
          docker run --rm --isolation=process `
            --mount "type=bind,source=$env:GITHUB_WORKSPACE,target=C:\workspace" `
            --workdir C:\workspace `
            python:3.13-windowsservercore-ltsc2022 `
            python scripts/ci_native_wheel_gate.py dist

      - name: Install wheel and execute native output on the runner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/ci_native_wheel_gate.py dist

  pcc1-package-parity:
    name: macOS arm64 native pcc1 and installed wheel
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PCC_REQUIRE_CURRENT_PCC1: "1"
      PCC_BOOTSTRAP_OUT_DIR: "${{ github.workspace }}/build/bootstrap"
      PCC_CURRENT_PCC1: "${{ github.workspace }}/build/bootstrap/pcc1"
      PCC_BOOTSTRAP_RUNTIME_CC: "pcc"
      PCC_BOOTSTRAP_RUNTIME_HIGH: "py"
      PCC_BOOTSTRAP_PYTHON_LIBPYTHON: "off"
      # macos-15 runners have 7 GB of RAM. The Darwin preflight requires
      # reclaimable memory >= tree cap + host reserve, and the reserve defaults
      # to 8 GiB for development machines, so it can never pass here. Stage1
      # with two frontend workers peaks near 2.1 GB.
      PCC_BOOTSTRAP_MAX_TREE_RSS_BYTES: "4294967296"
      PCC_BOOTSTRAP_HOST_MEMORY_RESERVE_BYTES: "536870912"
      # Three M1 cores: a local 12-core Stage1 already takes ~520 s.
      PCC_BOOTSTRAP_STAGE_TIMEOUT: "2400"
    steps:
      - uses: actions/checkout@v4

      - name: Require macOS arm64 self-backend runner
        run: |
          test "$(uname)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Build current pcc1
        run: |
          env -u LC_ALL uv run python scripts/bootstrap.py \
            --backend self \
            --stage 1 \
            --out-dir "$PCC_BOOTSTRAP_OUT_DIR"
          test -x "$PCC_BOOTSTRAP_OUT_DIR/pcc1"

      - name: Build, install, and execute the native wheel
        run: |
          env -u LC_ALL uv run pytest -x -n0 -vv --tb=short -m integration \
            tests/integration/test_uv_pcc_project_environment.py::test_uv_installed_pcc_and_pcc1_share_private_overlay

      - name: Run pcc1 package parity hard gate
        run: |
          env -u LC_ALL uv run pytest -x -q -n0 \
            tests/python/test_package_pcc1_parity_gate.py \
            tests/python/test_package_import_path.py \
            tests/python/test_package_install.py \
            tests/python/test_package_campaign.py \
            tests/python/test_package_linkage.py \
            tests/python/test_package_inspect.py \
            tests/python/test_package_extension_abi.py \
            tests/python/test_package_toolchain.py \
            tests/python/test_package_build_exec.py \
            tests/python/test_package_wheel_repo.py \
            tests/python/test_package_build_plan.py \
            tests/python/test_package_array_core.py
